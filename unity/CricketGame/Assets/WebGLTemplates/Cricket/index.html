<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1a12; overflow: hidden; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1a12; }
      #loader { position: fixed; inset: 0; display: grid; place-items: center; color: #f4f6fb;
        font: 600 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .08em; }
      #loader .box { width: min(340px, 72vw); text-align: center; }
      #loader .bar { height: 4px; margin-top: 14px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #loader .fill { height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #facc15); transition: width .2s; }
      #error { color: #fca5a5; margin-top: 14px; font-weight: 400; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader"><div class="box">LOADING CRICKET<div class="bar"><div class="fill" id="fill"></div></div><div id="error"></div></div></div>
    <script>
      // Messages the page posts before the game is ready (e.g. 'start' from a preloaded lobby) are kept for it.
      window.__cricketEarly = [];
      window.addEventListener('message', function (ev) {
        var d = ev.data;
        if (!window.__cricketEarly || !d || typeof d !== 'object' || d.source === 'cricket' || typeof d.type !== 'string') return;
        window.__cricketEarly.push(JSON.stringify({ type: d.type, id: d.id ? String(d.id) : '', query: d.query ? String(d.query) : '' }));
      });
      function post(type, payload) {
        try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'cricket', type: type, payload: String(payload) }, '*'); } catch (e) {}
      }
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.getElementById('unity-canvas');
      var config = {
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
        workerUrl: 'Build/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };
      var lastSent = -1;
      createUnityInstance(canvas, config, function (p) {
        document.getElementById('fill').style.width = Math.round(p * 100) + '%';
        // Real loading progress for the lobby page's bar (throttled to whole percents).
        var pct = Math.round(p * 100);
        if (pct !== lastSent) { lastSent = pct; post('progress', (p).toFixed(2)); }
      }).then(function (instance) {
        window.unityInstance = instance;
        document.getElementById('loader').remove();
        canvas.focus();
      }).catch(function (e) {
        document.getElementById('error').textContent = String(e);
        post('error', String(e));
      });
    </script>
  </body>
</html>
